# Un worker ABO sur une machine : l'agent, plus les moteurs qu'elle porte.
#
# L'agent parle aux moteurs sur le reseau interne du compose ; rien n'est
# publie sur l'hote. La seule connexion qui sort est celle de l'agent vers ABO.
#
#   ABO_WORKER_KEY=wk_... ABO_WORKER_SECRET=... docker compose up -d
#
# La cle et le secret viennent de la creation du worker cote backend :
#   python -m app.workers.cli create "PC du bureau" OWNED
#
# --- Choisir ce que la machine porte -----------------------------------------
# Les moteurs sont derriere des **profils** : une machine n'a aucune raison de
# lancer trois conteneurs de plusieurs gigaoctets pour n'en servir qu'un, et une
# machine sans carte ne doit pas tenter d'en demander une.
#
#   docker compose --profile tts up -d              la synthese Qwen (GPU)
#   docker compose --profile enhance-cpu up -d      le nettoyage rapide (CPU)
#   docker compose --profile tts --profile enhance-cpu up -d
#
# `ABO_ENGINES` doit s'accorder avec les profils lances : declarer un moteur
# qu'on ne fait pas tourner fait entrer dans la ferme une machine qui echouera
# au premier travail d'un utilisateur.
#
# --- Ou vivent les poids ------------------------------------------------------
# **Dans les images**, depuis `ADR-009` § 9. Une machine qui tire une image est
# prete a servir, et il n'y a plus rien a monter ni a preparer.
#
# La regle precedente — montage depuis `ABO_ENGINE_DATA` — reposait sur une
# premisse fausse : « une image qui porte ses poids se retelecharge en entier a
# chaque correction du serveur ». `docker pull` ne recupere que les couches
# MANQUANTES, et les poids sont ecrits sous le `COPY server.py`.
#
# **Ne remettez pas de volume sur `/weights`.** Il masquerait les poids cuits,
# ce qui donnerait le pire des deux mondes : une image lourde ET un
# telechargement au premier travail d'un utilisateur — decouvert par lui, pas
# par nous. `ABO_ENGINE_DATA` n'est plus lu par aucun service.

services:
  agent:
    build: ../agent
    # Reference par **digest**, et pas seulement par tag. Un tag mobile n'est
    # pas retelecharge par une machine qui l'a deja en cache : elle sert
    # l'ancienne image sans que rien ne le signale, et ca coute une location de
    # GPU pour rien. Le tag reste devant pour qu'on sache lire ce qu'on epingle.
    #
    # 0.5.0 : la concession de depot se demande **quand les octets existent**
    # (`ADR-013`), ce qui donne a chaque nature sa propre finalite. Avec une
    # concession unique frappee au bail, un `.qvoice` partait dans le stockage
    # de travail et disparaissait au bout de quatorze jours.
    # 0.4.0 : le profil de voix arrive en concession (`ABOB-137`).
    #
    # Une machine tiree d'une image anterieure fonctionne toujours — le backend
    # lui sert l'ancienne forme — mais elle repaie 33 Mo a chaque defaut de
    # cache, et son depot reste borne a une seule finalite.
    image: antoninocanta/abo-worker-agent:0.5.0@sha256:3eb8ca2b669fe78ed21d2bd3bdbf435e0c2d2426f4c8bceeda24ceeb94996909
    restart: unless-stopped
    # --- Le maillage, condition d'existence d'un worker (`ADR-015` § 1) -------
    #
    # Mode **noyau**, arbitre par Onin le 05/09. C'est ce qui rend ces trois
    # lignes obligatoires — et c'est aussi ce qui preserve l'installation en une
    # passe : le device et les capacites se **declarent** ici, personne ne
    # touche a l'hote.
    #
    # `NET_ADMIN` pour creer l'interface, `NET_RAW` pour les regles de
    # filtrage que tailscaled pose lui-meme. Sans elles il demarre et ne route
    # rien, ce qui est le pire des cas : un worker qui parait sain.
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # L'etat du noeud. Un noeud ephemere s'en passe, mais le garder evite de
      # rejouer une authentification a chaque redemarrage.
      - mesh_state:/var/lib/tailscale
    environment:
      # **Deux adresses, et la distinction n'est pas cosmetique** (`ABOB-157`).
      #
      # Le travail passe par le maillage et par lui seul : la surface machine
      # d'ABO n'est plus servie par le tunnel public, donc cette adresse-ci est
      # une adresse de maillage — `http://100.x.y.z:8080`, le port 8080 du
      # noeud `abo-backend`.
      ABO_BACKEND_URL: ${ABO_BACKEND_URL:-http://abo-backend:8080}
      # Le tunnel public, et pour **une seule chose** : faire remonter l'URL de
      # validation du maillage a la console. Au moment ou cette URL existe,
      # cette machine n'a pas d'adresse de maillage — c'est la definition de
      # l'enrolement. Il faut une porte avant la porte.
      #
      # Cet appel n'accorde rien : aucun bail, aucun credential, aucune
      # concession d'ecriture. Le laisser vide n'empeche pas l'enrolement, il
      # remet juste l'URL dans le seul journal du conteneur.
      ABO_BACKEND_PUBLIC_URL: ${ABO_BACKEND_PUBLIC_URL:-}
      ABO_WORKER_KEY: ${ABO_WORKER_KEY:?identifiant de machine requis}
      ABO_WORKER_SECRET: ${ABO_WORKER_SECRET:?secret d enrolement requis}
      # **Aucune cle d'enrolement.** L'enrolement est manuel, une fois par
      # machine : le conteneur affiche son URL de login au premier demarrage et
      # attend qu'on la valide dans la console Tailscale. Les workers sont peu
      # nombreux et durables, donc distribuer une cle reutilisable dans chaque
      # conteneur couterait un secret de plus a faire tourner pour rien.
      #
      # L'etat vit dans `mesh_state` : un `restart` ou un `up -d` apres
      # reconstruction ne redemande aucune validation. Retirer une machine pour
      # de bon se fait a la main dans la console, comme l'enrolement.
      #
      #   docker compose logs -f agent   # l'URL a valider
      #
      # Controle d'exploitation, facultatif : refuse de servir si le noeud a ete
      # valide depuis un autre compte que celui-la. Une adresse email
      # n'authentifie rien — c'est Tailscale qui authentifie — mais elle attrape
      # l'erreur d'operateur qui fait entrer une machine dans le mauvais
      # tailnet, donc dans un perimetre de confiance qui n'est pas le notre.
      ABO_TAILSCALE_EXPECTED_ACCOUNT: ${ABO_TAILSCALE_EXPECTED_ACCOUNT:-}
      # Combien de temps le conteneur attend la validation humaine.
      ABO_MESH_LOGIN_TIMEOUT: ${ABO_MESH_LOGIN_TIMEOUT:-900}
      # Les moteurs portes, declares au backend a l'enrolement :
      #   engineKey|modelKey|versionNumber|url[|mode]
      # Le backend confronte cette declaration a son registre de modeles : un
      # moteur qu'il ne connait pas est refuse, pas ignore.
      #
      # Le cinquieme champ est le **mode d'execution de cette capacite-la** —
      # `LOCAL_GPU`, `LOCAL_CPU` ou `PROXY` (`ADR-016` § 1). Il appartient a la
      # capacite et non a la machine : une seule machine peut donc melanger,
      # et c'est le cas courant plutot qu'un cas limite.
      #
      #   ABO_ENGINES=chatterbox|voice.chatterbox|1|vast+serverless://ep/convert|PROXY,
      #               deepfilternet|audio.deepfilternet|1|http://deepfilternet:18100|LOCAL_CPU
      #
      # Optionnel, et les defauts ne mentent pas : une adresse
      # `vast+serverless://` **est** un `PROXY`, l'agent le deduit et refuse de
      # se declarer autrement. Sans precision, un moteur local est `LOCAL_GPU`.
      # Le poser sert donc a nommer un `LOCAL_CPU`, qui est un niveau de service
      # et non un GPU au rabais — et c'est lui qui donne au differe sa matiere
      # premiere.
      #
      # **Le mode gouverne le placement** : un travail differe ne part jamais
      # sur une capacite `PROXY`, parce qu'il a ete vendu moitie prix contre de
      # la patience et qu'une capacite facturee a l'appel inverse l'economie.
      ABO_ENGINES: ${ABO_ENGINES:-qwen3_tts|voice.qwen3-tts|1|http://qwen3-tts:18100}
      # L'agent vit dans son propre conteneur et ne voit pas la carte du moteur.
      # La declarer sert au placement, jamais a accorder un droit.
      ABO_WORKER_GPU: ${ABO_WORKER_GPU:-}

  qwen3-tts:
    profiles: ["tts"]
    image: antoninocanta/abo-qwen3-tts:v1
    restart: unless-stopped
    # Forme liste, et pas mappage, pour une seule raison : c'est la seule qui
    # sache **retirer** une variable cuite dans l'ENV de l'image. Une entree
    # sans `=` est reprise de l'hote ; absente de l'hote, Compose ne la pose
    # pas du tout. `QWEN_CUDA_CONVDEC: ""` ne marcherait pas — le moteur teste
    # la presence, pas la valeur.
    environment:
      # Le moteur seul : ni certificat Vast, ni proxy PyWorker. Ici c'est
      # l'agent qui parle au backend, pas le moteur.
      - ABO_ENGINE_ONLY=1
      # Chaque resident garde un jeu de poids complet en VRAM (~3,9 Go en bf16
      # pour le 1.7B). Sur une carte de 8 Go, un seul tient — deux la feraient
      # tomber en OOM au milieu d'un chapitre. A relever sur 16 Go et plus.
      - QWEN_MAX_RESIDENT=${QWEN_MAX_RESIDENT:-1}
      # `cpu` pour une machine sans carte : meme modele, meme qualite de rendu,
      # un ordre de grandeur plus lent. Voir engines/qwen3_tts/README.md.
      - QWEN_BACKEND=${QWEN_BACKEND:-cuda}
      # Le talker fusionne est un gain reel.
      - QWEN_CUDA_FUSED_TALKER=${QWEN_CUDA_FUSED_TALKER:-1}
      # CONVDEC rend un SOUFFLE, pas une voix : bon format, bonne duree, aucune
      # erreur. Mesure du 01/09 sur RTX 2060 Super, meme texte, meme voix :
      #   avec CONVDEC   pic   644, 97,1 % de silences  -> muet
      #   sans CONVDEC   pic 12751, 32,4 % de silences  -> parole
      # Il est **cuit dans l'ENV de l'image** : ne rien passer ne suffit pas a
      # l'eteindre. Cette ligne sans `=` est ce qui le retire. Ne pas la
      # supprimer, et ne jamais lui donner de valeur.
      - QWEN_CUDA_CONVDEC
    # Le moteur n est joignable que depuis le reseau du compose.
    expose:
      - "18100"
    volumes:
      - voice_cache:/var/cache/abo/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Nettoyage de bruit. Le seul moteur qui ne demande pas de carte, et le seul
  # dont les poids tiennent dans le binaire : rien a telecharger, rien a monter.
  #
  #   ABO_ENGINES=deepfilternet|audio.deepfilternet|1|http://deepfilternet:18100
  deepfilternet:
    profiles: ["enhance-cpu"]
    build: ../engines/deepfilternet
    image: antoninocanta/abo-deepfilternet:v1
    restart: unless-stopped
    expose:
      - "18100"

  # Rehaussement 48 kHz. Plus agressif que DeepFilterNet et plus fidele a la
  # voix, mais il demande une carte : mesure du 03/09 sur RTX 2060 Super,
  # 85,3 dB de bruit retire contre 31, et 97 % de la parole conservee contre 94.
  # Il efface en revanche **toute** la piece entre les mots — a ecouter avant de
  # le choisir par defaut.
  clearervoice:
    profiles: ["enhance-gpu"]
    build: ../engines/clearervoice
    image: antoninocanta/abo-clearervoice:v1
    restart: unless-stopped
    expose:
      - "18100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Nettoyage profond : il **régénère** la parole au lieu de la filtrer. À
  # réserver aux prises que les deux autres ne sauveraient pas — il peut
  # s'écarter de ce qui a été prononcé, là où les autres ne peuvent que perdre
  # du signal.
  #
  # Le plus lourd des quatre : image de 16,9 Go, torch 2.1.1 épinglé par
  # l'amont, donc pas de couche partagée avec les deux autres moteurs.
  resemble-enhance:
    profiles: ["enhance-deep"]
    build: ../engines/resemble_enhance
    image: antoninocanta/abo-resemble-enhance:v1
    restart: unless-stopped
    expose:
      - "18100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Transfert de jeu — « Follow My Lead ». Ses poids sont dans l'image comme
  # ceux des autres depuis `ADR-009`.
  #
  #   docker compose --profile transfer up -d
  #   ABO_ENGINES=chatterbox|voice.chatterbox|1|http://chatterbox:18100
  chatterbox:
    profiles: ["transfer"]
    build: ../engines/chatterbox
    image: antoninocanta/abo-chatterbox:v1
    restart: unless-stopped
    expose:
      - "18100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  voice_cache:
  # L'identite du noeud de maillage de cette machine. Un volume nomme et pas un
  # bind mount : Docker recopie le contenu de l'image dans un volume nomme vide,
  # la ou un bind mount masquerait — piege deja paye sur les poids des moteurs.
  mesh_state:
